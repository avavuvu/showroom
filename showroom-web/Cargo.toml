[features]
development = []
local = ["boutique/devtools"]

[package]
name = "showroom-web"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
boutique = { git = "https://github.com/avavuvu/boutique.git", rev = "ed4b8940acaad762ee7514d374d3f9a2d8e279ec", features = ["cloudinary"] }
bq_components = { git = "https://github.com/avavuvu/boutique.git", rev = "ed4b8940acaad762ee7514d374d3f9a2d8e279ec" }
axum = { version = "0.8.9", features = ["multipart"] }
sea-orm = { version = "1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
validator = { version = "0.20", features = ["derive"] }
maud = { version = "0.27", features = ["axum"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
axum-extra = { version = "0.10", features = ["cookie"] }
dotenvy = "0.15"
nanoid = "0.4"
url = "2"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-sesv2 = "1"

slugify = "0.1.0"
csv = "1"
