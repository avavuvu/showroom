[features]
development = []
local = ["boutique/devtools"]

[package]
name = "showroom-web"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
boutique = { git = "https://github.com/avavuvu/boutique.git", rev = "430115b4593f9afea4103843e07880d724fc507a", features = ["cloudinary", "sea-orm", "ts"] }
bq_components = { git = "https://github.com/avavuvu/boutique.git", rev = "430115b4593f9afea4103843e07880d724fc507a" }
axum = { version = "0.8.9", features = ["multipart"] }
sea-orm = { version = "1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
strum = { version = "0.26", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
validator = { version = "0.20", features = ["derive"] }
maud = { version = "0.27", features = ["axum"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
dotenvy = "0.15"
nanoid = "0.4"
url = "2"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-sesv2 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }

slugify = "0.1.0"
csv = "1"
css-inline = { version = "0.22", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
html-escape = "0.3.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
similar = "2"

[build-dependencies]
bq_setups = { git = "https://github.com/avavuvu/boutique.git", rev = "430115b4593f9afea4103843e07880d724fc507a" }
