[package]
name = "migration"
version = "0.1.0"
edition = "2024"

[lib]
name = "migration"
path = "src/lib.rs"

[[bin]]
name = "migration"
path = "src/main.rs"

[[bin]]
name = "seed"
path = "src/seed.rs"

[dependencies]
sea-orm-migration = { version = "1", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
argon2 = "0.5"
chrono = "0.4"
dotenvy = "0.15"
fake = { version = "5.1.0", features = ["derive"] }
nanoid = "0.4"
sea-orm = { version = "1", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
showroom-web = { path = "../showroom-web" }
serde_json = "1"
