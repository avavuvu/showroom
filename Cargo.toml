[workspace]
exclude = ["migration"]

[features]
development = []
local = ["dep:dioxus-devtools"]

[package]
name = "showroom-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
sea-orm = { version = "1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
validator = { version = "0.20", features = ["derive"] }
maud = { version = "0.27", features = ["axum"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tower-livereload = "0.10"
axum-extra = { version = "0.10", features = ["cookie"] }
jsonwebtoken = "9"
time = "0.3"
dotenvy = "0.15"
nanoid = "0.4"
url = "2"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-sesv2 = "1"

slugify = "0.1.0"
csv = "1"
dioxus-devtools = { version = "0.7.3", optional = true, features = ["serve"] }
