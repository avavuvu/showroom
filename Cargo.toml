[workspace]
members = ["migration"]

[package]
name = "showroom-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
sea-orm = { version = "1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
serde = { version = "1.0.228", features = ["derive"] }
argon2 = "0.5"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
html-to-string-macro = "0.2"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tower-livereload = "0.10"
tower-sessions = "0.14"
dotenvy = "0.15"
